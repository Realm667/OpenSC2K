name: Reticulating Splines desktop builds
run-name: RS desktop builds (${{ github.ref_name }})

on:
  workflow_dispatch:
    inputs:
      native_run:
        description: Optional previous RS workflow run; accepted only after all native jobs pass and build inputs match
        type: string
        default: ''
      signing:
        description: macOS signing (none = ad-hoc preview; required = Developer ID and notarization)
        type: choice
        options: [none, optional, required]
        default: none

permissions:
  contents: read
  actions: read

jobs:
  native:
    if: inputs.native_run == ''
    name: Build native libraries (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - platform: macos
            runner: macos-15
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: windows-x86_64
            runner: windows-2025
          - platform: windows-arm64
            runner: windows-11-arm
            # tools/build_native.py selects the target from the Python architecture
            python-architecture: arm64
    runs-on: ${{ matrix.runner }}
    # macOS builds every crate twice for the universal library. A cold Rust cache needs about 35 minutes
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python-architecture }}
      - name: Restore the Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native
      # cpal in the native game links ALSA on Linux
      - name: Install the ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      # rust-toolchain.toml selects the Rust version. rustup is on each runner image.
      # The audio library folder also receives FluidSynth, which needs CMake
      - name: Build the package libraries
        run: python tools/build_native.py --package
      - name: Save the libraries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ matrix.platform }}
          path: |
            game/bin/opensc2k_simulation/${{ matrix.platform }}/*
            game/bin/opensc2k_rendering/${{ matrix.platform }}/*
            game/bin/opensc2k_formats/${{ matrix.platform }}/*
            game/bin/opensc2k_audio/${{ matrix.platform }}/*
            game/bin/opensc2k_scripting/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build desktop packages
    needs: native
    if: ${{ !cancelled() && (needs.native.result == 'success' || inputs.native_run != '') }}
    runs-on: macos-15
    # notarization usually takes a few minutes, but Apple can queue a submission longer
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install Godot and export templates
        run: bash tools/setup_godot_ci.sh
      - name: Verify reusable native build inputs
        if: inputs.native_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN: ${{ inputs.native_run }}
        run: python tools/verify_rs_native_reuse.py --repository "$GITHUB_REPOSITORY" --run "$NATIVE_RUN"
      - name: Collect native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: native-*
          github-token: ${{ github.token }}
          run-id: ${{ inputs.native_run || github.run_id }}
          path: local/native
          merge-multiple: true
      - name: Prepare macOS signing
        if: inputs.signing != 'none'
        env:
          SIGNING: ${{ inputs.signing }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash tools/setup_macos_signing_ci.sh
      - name: Check release helpers
        run: python -m unittest discover -s tools -p test_rs_release.py
      - name: Build desktop packages
        env:
          SIGNING: ${{ inputs.signing }}
        run: |
          label=$(python -c 'import pathlib,re; print(re.search(r"^config/version=\"([^\"]+)\"", pathlib.Path("game/project.godot").read_text(), re.M).group(1))')
          require=''
          if [ "$SIGNING" = required ]; then
            require=--require-notarization
          fi
          python tools/build_desktop_release.py --output local/packages --label "$label" --native local/native --reticulating-splines $require
      - name: Remove the signing keychain
        if: always() && inputs.signing != 'none'
        run: bash tools/cleanup_macos_signing_ci.sh
      - name: Save packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rs-desktop-packages
          path: local/packages/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  smoke:
    name: Start packaged application (${{ matrix.platform }} / ${{ matrix.runner }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-universal
            runner: macos-15
          - platform: macos-universal
            runner: macos-15-intel
          - platform: windows-x64
            runner: windows-2025
          - platform: windows-arm64
            runner: windows-11-arm
            python-architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python-architecture }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rs-desktop-packages
          path: local/packages
      - name: Install Linux audio runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2t64
      - name: Verify archive and start with an isolated profile
        run: python tools/smoke_rs_package.py --packages local/packages --platform ${{ matrix.platform }} --output local/smoke
      - name: Save package verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rs-smoke-${{ matrix.platform }}-${{ matrix.runner }}
          path: local/smoke/*
          retention-days: 7
